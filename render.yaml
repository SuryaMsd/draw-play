services:
  # Backend service
  - type: web
    name: doodle-play-server
    env: node
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doodle-play-db
          property: connectionString
      - key: CLIENT_URL
        value: https://doodle-play.onrender.com # Update with final URL

  # Frontend service
  - type: web
    name: doodle-play-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        value: https://doodle-play-server.onrender.com
      - key: VITE_API_URL
        value: https://doodle-play-server.onrender.com

databases:
  - name: doodle-play-db
    plan: free
