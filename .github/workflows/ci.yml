name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install & Build Server
      run: |
        cd server
        npm install
        npx prisma generate
        npm run build

    - name: Install & Build Client
      run: |
        cd client
        npm install
        npm run build
